<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PUBG MARKET — Akkaunt bozori</title>
<meta name="description" content="PUBG akkauntlarini xavfsiz sotib oling va soting. Har bir kelishuvda admin kafolati." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header class="topbar">
  <div class="logo"><span class="logo-mark">◎</span> PUBG<span>MARKET</span></div>
  <div class="who" id="who"></div>
</header>

<main>
  <section class="hero">
    <div class="hero-in">
      <div class="kicker">🔥 AKKAUNT MAGAZIN</div>
      <h1>PUBG akkauntini <em>sot</em> yoki <em>sotib ol</em></h1>
      <p>Rasm, video, narx va tavsif bilan e'lon joylang. Kelishuv admin orqali — o'rtada admin turadi.</p>
      <div class="hero-actions">
        <button class="btn primary" id="sellBtn">➕ E'lon joylash</button>
        <span class="badge">🛡 Admin kafolati</span>
      </div>
    </div>
  </section>

  <section class="filters">
    <input id="q" class="input" type="search" placeholder="Qidirish: sarlavha, tavsif..." />
    <div class="row">
      <label>Narx (dan)<input id="minP" class="input" type="number" placeholder="0" /></label>
      <label>Narx (gacha)<input id="maxP" class="input" type="number" placeholder="5000000" /></label>
    </div>
    <div class="chips" id="sorts">
      <span class="chip-label">SARALASH</span>
      <button class="chip active" data-sort="new">Yangi</button>
      <button class="chip" data-sort="cheap">Arzon</button>
      <button class="chip" data-sort="expensive">Qimmat</button>
      <button class="chip" data-sort="level">LVL bo'yicha</button>
      <button class="chip" id="hideSold">Sotilganlarni yashir</button>
      <button class="chip ghost" id="reset">Tozalash</button>
    </div>
  </section>

  <section class="list-head">
    <h2>Sotuvdagi akkauntlar</h2>
    <span id="count" class="muted">0 ta e'lon</span>
  </section>

  <section id="grid" class="grid"></section>
  <div id="empty" class="empty hidden">Hozircha e'lon yo'q. Birinchi bo'lib akkauntingizni joylang!</div>
</main>

<div class="sheet hidden" id="sheet">
  <div class="sheet-in">
    <button class="sheet-close" id="sheetClose">✕</button>
    <div id="sheetBody"></div>
  </div>
</div>

<nav class="tabbar">
  <button class="tab active" data-tab="shop">🛒<span>Magazin</span></button>
  <button class="tab" data-tab="sell">➕<span>Sotish</span></button>
  <button class="tab" data-tab="my">👤<span>Mening</span></button>
</nav>

<script src="/static/app.js"></script>
</body>
</html>
