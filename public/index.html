<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PUBG Akkaunt Magazini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="scanlines"></div>
<div class="fx" id="fx"></div>

<header class="hero">
  <div class="crate">
    <div class="crate-glow"></div>
    <div class="chute">🪂</div>
    <div class="crate-box">📦</div>
  </div>
  <h1 class="title">PUBG <span>MAGAZIN</span></h1>
  <p class="sub">🛡 Garant: savdo admin orqali xavfsiz</p>
  <div class="stats">
    <div class="stat"><b id="cnt">0</b><span>AKKAUNT</span></div>
    <div class="stat"><b>24/7</b><span>ONLINE</span></div>
    <div class="stat"><b>100%</b><span>GARANT</span></div>
  </div>
</header>

<div class="toolbar">
  <input id="q" placeholder="🔎 Qidirish: lvl, narx, skin..." />
  <select id="sort">
    <option value="new">🆕 Yangi</option>
    <option value="cheap">💸 Arzon</option>
    <option value="rich">💎 Qimmat</option>
    <option value="lvl">📈 LVL</option>
  </select>
</div>

<main id="grid" class="grid"></main>
<div id="empty" class="empty" hidden>📭 Hozircha akkaunt yo'q. Birinchi bo'lib qo'ying!</div>

<div id="modal" class="modal" hidden>
  <div class="sheet">
    <button class="close" id="close">✕</button>
    <div class="media" id="media"></div>
    <div id="detail"></div>
    <button class="buy" id="buy">🛒 SOTIB OLISH (admin garant)</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
